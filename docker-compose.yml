version: "3.8"

services:
  mysql1:
    image: mysql:latest
    container_name: mysql1
    ports:
      - "3307:3306"  # Port externe 3307 vers interne 3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  spring-app:
    image: meriem01/tp-foyer:5.0.0
    container_name: spring-app
    ports:
      - "8089:8080"  # Port externe 8089 vers interne 8080
    depends_on:
      - mysql1
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql1:3306/db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    command: >
      /bin/bash -c "until nc -z mysql1 3306; do echo waiting for mysql1; sleep 2; done; java -jar /path/to/spring-boot-app.jar"
    restart: unless-stopped

volumes:
  mysql-data:
