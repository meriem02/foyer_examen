version: '3.8'

services:
  mysql1:
    image: mysql:5.7  # Vérifiez que l'image MySQL est correcte
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql-data:
    driver: local

networks:
  app-network:
    driver: bridge
