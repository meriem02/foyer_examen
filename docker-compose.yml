services:
  springboot-app:
    image: meriem01/tp-foyer:5.0.0
    ports:
      - 8089:8089
    depends_on:
      - mysqldb
    restart: always
  mysqldb:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: meriem
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=root || exit 1"]
      interval: 10s
      retries: 5
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: {}
